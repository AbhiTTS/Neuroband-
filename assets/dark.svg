<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img" aria-labelledby="t d">
<title id="t">NeuroBand — AI and brain-computer interface</title>
<desc id="d">Animated premium NeuroBand developer hero with neural ASCII portrait and terminal interface.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#7C3AED"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/></linearGradient>
  <radialGradient id="bg" cx=".65" cy=".2"><stop stop-color="#312E81" stop-opacity=".38"/><stop offset=".65" stop-color="#030712" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
