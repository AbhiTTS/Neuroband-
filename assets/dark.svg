<text x="24" y="300" fill="#F8FAFC" font-family="monospace" font-size="13">listen → interpret → act</text>
<text x="24" y="330" fill="#22D3EE" font-family="monospace" font-size="13">_</text><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
