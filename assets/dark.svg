  <clipPath id="clip"><rect width="1180" height="610" rx="32"/></clipPath>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <mask id="fade"><linearGradient id="fm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient><rect width="1180" height="610" fill="url(#fm)"/></mask>
</defs>
<g clip-path="url(#clip)">
